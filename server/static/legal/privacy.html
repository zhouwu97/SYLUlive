<p>沈理校园按照功能必要、最小范围和用户可控原则处理个人信息，不出售个人信息，不将教务数据用于广告营销。</p>
<p>远程消息推送默认关闭。用户主动开启并确认极光推送处理摘要后，才初始化 SDK、获取 Registration ID、绑定 Alias 和上传设备标识。当前版本一个账号仅支持一台设备接收远程消息。</p>
<p>用户可以查阅、导出、更正、删除个人信息，解除教务绑定、关闭推送和注销账号。注销采用本地身份匿名化优先，远端清理失败进入重试任务。</p>
