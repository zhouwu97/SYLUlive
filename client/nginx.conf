server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Android App Links 声明必须按固定路径返回，不能落入 Flutter 路由。
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files /assetlinks.json =404;
    }

    # 未安装 App 时，组队分享链接落到轻量静态页面。
    location ~ ^/team/[1-9][0-9]*/?$ {
        try_files /share/team/index.html =404;
    }

    # Flutter 构建产物
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI Run SSE 事件流：禁用缓冲与缓存，拉长读写超时，保证增量实时推达。
    # 正则 location 优先于下面的前缀 location /api/。
    location ~ ^/api/ai/runs/.+/events$ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API 代理到后端
    location /api/ {
        # 试卷库允许最大 20 MiB 的 PDF；额外空间用于 multipart 边界，实际文件大小仍由后端严格校验。
        client_max_body_size 21m;

        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
    }

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
