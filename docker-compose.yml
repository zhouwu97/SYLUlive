services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_DB=shenliyuan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shenliyuan_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go后端服务

  python-edu-service:
    build:
      context: ./python-edu-service
      dockerfile: Dockerfile
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-}
      - JWC_CRAWLER_CONTACT=${JWC_CRAWLER_CONTACT:-}
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - shenliyuan_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - DSN=${DSN:-host=postgres port=5432 user=postgres password=${DB_PASSWORD:?set DB_PASSWORD in .env} dbname=shenliyuan sslmode=disable}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - EXAM_PAPER_DIR=${EXAM_PAPER_DIR:-/app/private/exam-papers}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:?set SUPER_ADMIN_ID in .env}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD in .env}
      - EDU_SERVICE_URL=${EDU_SERVICE_URL:-http://python-edu-service:8000}
      - EDU_SERVICE_TOKEN=${EDU_SERVICE_TOKEN:-}
      - JWC_SYNC_ENABLED=${JWC_SYNC_ENABLED:-false}
      - JWC_SYNC_INTERVAL_MINUTES=${JWC_SYNC_INTERVAL_MINUTES:-20}
      - GIN_MODE=release
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_data:/app/uploads
      - exam_paper_data:/app/private/exam-papers
    restart: unless-stopped
    networks:
      - shenliyuan_network


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/build/web:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - shenliyuan_network

volumes:
  server_data:
  exam_paper_data:
  postgres_data:

networks:
  shenliyuan_network:
    driver: bridge
