name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Check changed Go files are formatted
        working-directory: .
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}"..."$GITHUB_SHA" -- '*.go')
          elif [[ -n "$GITHUB_EVENT_BEFORE" && "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]]; then
            files=$(git diff --name-only "$GITHUB_EVENT_BEFORE" "$GITHUB_SHA" -- '*.go')
          else
            files=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- '*.go')
          fi
          if [[ -z "$files" ]]; then
            echo "No changed Go files to format-check."
            exit 0
          fi
          printf '%s\n' "$files" | xargs gofmt -d | (! grep .)
      - run: go vet ./...
      - run: go test ./...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sylulive_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sylulive_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/sylulive_integration_test?sslmode=disable
      ALLOW_DESTRUCTIVE_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run PostgreSQL idempotency integration tests
        working-directory: server
        run: >-
          go test -tags=integration ./internal/middleware
          -run '^TestIdempotencyMiddlewarePostgres' -count=1

  migration-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sylulive_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sylulive_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/sylulive_migration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Upgrade legacy and current-minus-one fixtures twice
        working-directory: server
        run: >-
          go test -tags=integration ./internal/models
          -run TestIdempotencySchemaUpgradeFromLegacyFixtures -count=1

  edu-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-edu-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  school-boundary-security:
    # PR0/PR1 门禁：源码与实际容器发布边界必须同时可证明。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install boundary test runner
        run: python -m pip install --disable-pip-version-check pytest
      - name: Scan school authority boundary
        run: python scripts/security/school_boundary_scan.py --root . --pretty
      - name: Run boundary scanner regression tests
        run: python -m pytest -q python-edu-service/tests/test_school_boundary_scan.py
      - name: Run zero-authority evidence tool regression tests
        run: python -m unittest scripts.security.test_zero_authority_verify -v
      - name: Validate zero-authority evidence contract
        run: python scripts/security/zero_authority_verify.py --dry-run --pretty
      - name: Run identity migration contract tests
        run: >-
          python -m unittest
          scripts.migration.test_identity_dependency_inventory
          scripts.migration.test_identity_preflight -v

  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-rag-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  client:
    # Golden 平台可复现性：ubuntu-latest 镜像随 runner 更新漂移
    # （freetype/fontconfig 变化会让 canonical golden 全线 0.x% 抖动）。
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # 关键可靠性路径使用默认 fatal 规则；保留全仓库历史样式告警的渐进式收口。
      - name: Analyze reliability-critical surfaces
        run: >-
          flutter analyze
          lib/screens/market_screen.dart
          lib/screens/poll/poll_detail_screen.dart
          lib/screens/notifications_screen.dart
          lib/screens/admin_panel_screen.dart
          lib/screens/admin_candidates_screen.dart
          lib/services/app_resume_coordinator.dart
          lib/services/retry_interceptor.dart
          lib/services/root_page_state_service.dart
          lib/services/keep_alive_service.dart
          lib/widgets/bottom_nav.dart
          lib/screens/image_viewer_screen.dart
          lib/providers/poll_provider.dart
          lib/providers/major_provider.dart
          lib/providers/teacher_provider.dart
          lib/providers/social_provider.dart
          lib/screens/my_content_screen.dart
          lib/screens/major_detail_screen.dart
          lib/screens/social_list_screen.dart
      - run: flutter test --reporter compact
      - name: Create ephemeral Android signing key
        working-directory: client/android/app
        env:
          ANDROID_STORE_PASSWORD: codex-ci-store
          # PKCS12（keytool 现代默认格式）不支持独立 key 密码，必须与 store 密码一致。
          ANDROID_KEY_PASSWORD: codex-ci-store
        run: >-
          keytool -genkeypair -v
          -keystore xiaoyuan.jks
          -storetype PKCS12
          -storepass "$ANDROID_STORE_PASSWORD"
          -keypass "$ANDROID_KEY_PASSWORD"
          -alias xiaoyuan
          -keyalg RSA
          -keysize 2048
          -validity 1
          -dname "CN=CI,O=SYLUlive,C=CN"
      - name: Build release APK smoke
        env:
          ANDROID_STORE_PASSWORD: codex-ci-store
          ANDROID_KEY_PASSWORD: codex-ci-store
        run: >-
          flutter build apk --release
          --dart-define=APP_API_URL=https://example.invalid/api
          --dart-define=JPUSH_APP_KEY=000000000000000000000000

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/ai_rag_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run independent pgvector migration test
        working-directory: server
        run: go test ./internal/models -run TestPGVectorMigrationIntegration -count=1

  client-platform-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze OHOS platform integrity
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify no direct Android plugin usage
        run: |
          if grep -rnE 'package:(jpush_flutter|flutter_local_notifications|url_launcher|flutter_secure_storage)' lib/ | grep -v 'lib/platform/'; then
            echo "Found direct usage of Android plugins without platform abstraction."
            exit 1
          fi


