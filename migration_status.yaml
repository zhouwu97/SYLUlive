      - "扫码结果严格解析 sylulive://competition/<id> 与 sylulive://schedule/share/<code>，拒绝错误协议、额外路径、查询参数和非法编号"
      - "竞赛二维码先显示编号预览并要求用户确认，确认后才打开竞赛详情"
      - "课表分享码仅显示只读预览和未导入提示，不会在缺少后端接口时伪造或覆盖课表数据"
      - "扫码解析、MethodChannel 行为与平台边界共 12 项定向测试通过，定向静态分析无告警"
      - "API 24 x64 signed HAP 编译通过"
    issues:
      - type: "backend_capability"
        description: "仓库和现有后端没有课表分享码预览、确认导入接口；sylulive://schedule/share/<code> 当前只能安全预览，不能完成导入"
        priority: "high"
      - type: "device_validation"
        description: "supportsScanKit 仍保持关闭；需用户在当前在线模拟器验收系统扫码界面、取消、错误二维码和竞赛详情确认跳转，再开放入口"
        priority: "high"

  - name: "阶段 11 第四个鸿蒙特性（应用接续或 Push Kit）"
    status: "completed"
    completed:
      - "选择应用接续方案，不引入未验收的 Push Kit 依赖"
      - "竞赛详情保存脱敏页面状态，EntryAbility.onContinue 通过 ArkData Preferences 提供接续状态"
      - "冷启动、热启动和接续状态均复用深链通道，单次消费并校验 schemaVersion"
