# 合并到现有 sylulive.online 的 HTTPS server 中，保留官网和分享入口。
# 将 web/dist 的内容复制到 /var/www/sylulive/web/。
location = /web { return 302 /web/; }
location /web/ {
    root /var/www/sylulive;
    try_files $uri $uri/ /web/index.html;
    add_header Cache-Control "no-cache";
}
# 若已有 API location，在原段内加入 SSE 设置，不重复添加 location。
location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 300s;
    client_max_body_size 30m;
}
# 附件仍经过原服务的访问控制，不直接映射私有文件目录。
location /uploads/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
