name: CI

on:
  push:
  pull_request:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: gofmt -d $(find . -name '*.go') | (! grep .)
      - run: go test ./...

  edu-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-edu-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-rag-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - run: flutter test --reporter compact

  python-edu-service-unchanged:
    # 保留既有 Job ID，避免分支保护检查名失效。阶段 4B.1 后不再冻结目录，
    # 改为持续阻止已退役的服务器课表缓存实现回归。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure retired server course cache stays disabled
        run: |
          test ! -e python-edu-service/scripts/migrate_course_terms.py
          if rg -n --glob '*.py' \
            'courses_(raw|custom)|\bCourseRaw\b|\bCourseCustom\b' \
            python-edu-service \
            --glob '!python-edu-service/tests/**' \
            --glob '!python-edu-service/services/course_cache_retirement.py'; then
            echo "已退役的服务器课表缓存实现不能重新引入"
            exit 1
          fi

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/ai_rag_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run independent pgvector migration test
        working-directory: server
        run: go test ./internal/models -run TestPGVectorMigrationIntegration -count=1
