name: Security Scans

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Go vulnerability scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go dependencies
        run: govulncheck ./...

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: python-edu-service
            requirements: requirements.txt
          - directory: python-rag-service
            requirements: requirements.txt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit
      - name: Audit pinned dependencies
        working-directory: ${{ matrix.directory }}
        run: python -m pip_audit -r ${{ matrix.requirements }}

  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.13'
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.28.0
      - name: Scan introduced commits
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_opts="$PR_BASE_SHA..$PR_HEAD_SHA"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            log_opts="$EVENT_BEFORE..$COMMIT_SHA"
          else
            log_opts="--max-count=1 $COMMIT_SHA"
          fi
          "$(go env GOPATH)/bin/gitleaks" git --no-banner --redact --log-opts="$log_opts" .

  codeql-go:
    name: CodeQL Go
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          build-mode: autobuild
      - uses: github/codeql-action/analyze@v3

  codeql-python:
    name: CodeQL Python
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none
      - uses: github/codeql-action/analyze@v3
