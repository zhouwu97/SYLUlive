    status: "in_progress"
    completed:
      - "Flutter HomeCardService、ArkTS MethodChannel、Preferences 和 FormExtensionAbility 已接入"
      - "已实现 2x2 下一节课、4x2 今日课程和 4x2 学业提醒三张服务卡片"
      - "课程、考试和竞赛数据刷新入口已接入，考试空状态不会创建考试数据"
      - "三张动态卡片按华为官方指南改为根容器 onClick + postCardAction(router)，只传递 abilityName 和 homeCardRoute"
      - "OhosDeepLinkPlugin 同时兼容直接 homeCardRoute 与 parameters.params.homeCardRoute 参数包装"
      - "考试空列表改为可修改列表，手动添加不再触发 Unsupported operation"
      - "考试弹窗控制器由路由内 StatefulWidget 管理，退场动画期间不再提前释放"
      - "手动添加考试持久化和三张动态卡片 router 结构共 6 项定向测试通过"
      - "上一版本 x64 HAP 已使用 hdc install -r 保留数据覆盖安装，首次安装时间保持不变；最新参数兼容性 HAP 等待设备恢复后部署"
