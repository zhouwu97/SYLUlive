      - "教务绑定使用单条原子缓存，安全存储失败时回滚本地绑定状态"
      - "教务绑定输入校验和失败弹窗保留已完成，可直接修改后重试"
    issues:
      - type: "device_validation"
        description: "真实设备手动退出后的会话清理，以及重新输入教务凭据后的绑定提交仍待验收；当前无可恢复凭据，为保留账号未执行登出或解绑"
