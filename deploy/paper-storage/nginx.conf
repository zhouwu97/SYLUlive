user paper-storage;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志只记录规范化路径，不记录包含短时下载凭证的查询参数。
    log_format paper_storage '$remote_addr - $remote_user [$time_local] '
                             '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log paper_storage;

    sendfile on;
    tcp_nopush on;
    server_tokens off;
    types_hash_max_size 2048;
    client_max_body_size 21m;
    client_body_timeout 300s;
    send_timeout 300s;

    upstream paper_storage {
        server 127.0.0.1:8081;
        keepalive 16;
    }

    # 安装脚本根据证书是否存在渲染以下两个明确的 TLS 路径。
    ssl_certificate __PAPER_STORAGE_TLS_CERTIFICATE__;
    ssl_certificate_key __PAPER_STORAGE_TLS_CERTIFICATE_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name __PAPER_STORAGE_PUBLIC_IP__;

        location ^~ /.well-known/acme-challenge/ {
            root /var/lib/letsencrypt;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://__PAPER_STORAGE_PUBLIC_IP__$request_uri;
        }
    }

    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name __PAPER_STORAGE_PUBLIC_IP__;

        add_header Referrer-Policy "no-referrer" always;
        autoindex off;

        location /healthz {
            proxy_pass http://paper_storage;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        location /v1/uploads/ {
            proxy_pass http://paper_storage;
            proxy_http_version 1.1;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /v1/files/ {
            proxy_pass http://paper_storage;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            # 下载授权位于查询参数中，因此完全关闭该位置的访问日志。
            access_log off;
        }

        location /internal/v1/ {
            proxy_pass http://paper_storage;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /_paper_files/ {
            internal;
            alias /opt/sylg-paper-storage/data/exam-papers/;
            autoindex off;
            disable_symlinks on from=/opt/sylg-paper-storage/data/exam-papers/;
            add_header Cache-Control "private, no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            access_log off;
        }

        # 禁止访问隐藏目录和任何未显式声明的路径。
        location ~ (^|/)\. {
            deny all;
            access_log off;
            log_not_found off;
        }

        location / {
            return 404;
        }
    }
}
