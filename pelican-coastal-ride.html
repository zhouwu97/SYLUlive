<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#132e32">
  <title>鹈鹕的海岸骑行</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Instrument Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: #132e32;
      color: #fff1d2;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 56px);
    }

    main { width: min(100%, 1120px); }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: clamp(12px, 2vw, 20px);
    }

    h1 {
      margin: 0;
      font-size: clamp(17px, 2.3vw, 25px);
      font-weight: 600;
      letter-spacing: .08em;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      min-height: 44px;
      padding: 0 14px;
      border: 1px solid #829991;
      border-radius: 100px;
      color: inherit;
      background: transparent;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    button:focus-visible { outline: 2px solid #f8a276; outline-offset: 4px; }
    button svg { width: 14px; height: 14px; fill: currentColor; }
    [hidden] { display: none !important; }

    @media (hover: hover) and (pointer: fine) {
      button:hover { background: #234449; }
    }

    .scene {
      display: block;
      width: 100%;
      height: auto;
      overflow: hidden;
      border-radius: clamp(7px, 1.4vw, 16px);
      outline: 1px solid #fff1d248;
    }
  </style>
</head>

  <script>
    const byId = (id) => document.getElementById(id);
    const playback = byId('playback');
    const playbackIcon = byId('playback-icon');
    const playbackLabel = byId('playback-label');
    const rearWheel = byId('rear-wheel');
    const frontWheel = byId('front-wheel');
    const crank = byId('crank');
    const pelican = byId('pelican');
    const scarf = byId('scarf-tail');
    const eye = byId('eye');
    const clouds = byId('drifting-clouds');
    const water = byId('water');
    const gulls = byId('gulls');
    const road = byId('road');
    const grasses = byId('grasses');
    const windOne = byId('wind-one');
    const windTwo = byId('wind-two');

    const farLeg = {
      hip: { x: 456, y: 375 },
      thighLength: 75,
      shinLength: 77,
      thigh: byId('far-thigh'),
      shin: [byId('far-shin')],
      foot: byId('far-foot'),
    };
    const nearLeg = {
      hip: { x: 482, y: 376 },
      thighLength: 76,
      shinLength: 78,
      thigh: byId('near-thigh'),
      shin: [byId('near-shin-edge'), byId('near-shin')],
      foot: byId('near-foot'),
    };

    const radiansToDegrees = 180 / Math.PI;
    const fullTurn = Math.PI * 2;
    const crankCenter = { x: 496, y: 493 };
    const crankRadius = 23;
    const wheelRadius = 80.5;
    const speed = 310;

    function pointAlong(start, end) {
      const direction = Math.atan2(end.y - start.y, end.x - start.x) * radiansToDegrees;
      return `translate(${start.x} ${start.y}) rotate(${direction})`;
    }

    function positionLeg(leg, phase) {
      const pedal = {
        x: crankCenter.x + Math.cos(phase) * crankRadius,
        y: crankCenter.y + Math.sin(phase) * crankRadius,
      };
      const footAngle = 10 * Math.sin(phase);
      const footRadians = footAngle / radiansToDegrees;
      const ankle = {
        x: pedal.x - 5 * Math.cos(footRadians) + 8 * Math.sin(footRadians),
        y: pedal.y - 5 * Math.sin(footRadians) - 8 * Math.cos(footRadians),
      };
      const dx = ankle.x - leg.hip.x;
      const dy = ankle.y - leg.hip.y;
      const reach = Math.hypot(dx, dy);

      // The forward intersection of the thigh and shin circles keeps the foot on the pedal.
      const along = (leg.thighLength ** 2 - leg.shinLength ** 2 + reach ** 2) / (2 * reach);
      const forward = Math.sqrt(leg.thighLength ** 2 - along ** 2);
      const knee = {
        x: leg.hip.x + (dx * along + dy * forward) / reach,
        y: leg.hip.y + (dy * along - dx * forward) / reach,
      };

      leg.thigh.setAttribute('transform', pointAlong(leg.hip, knee));
      const shinPose = pointAlong(knee, ankle);
      for (const segment of leg.shin) segment.setAttribute('transform', shinPose);
      leg.foot.setAttribute('transform', `translate(${pedal.x} ${pedal.y}) rotate(${footAngle})`);
    }

    function render(time) {
      const phase = (time / 1.85 * fullTurn + Math.PI / 4) % fullTurn;
      const distance = time * speed;
      const wheelAngle = (distance / wheelRadius * radiansToDegrees) % 360;
      const wheelPose = `rotate(${wheelAngle})`;
      rearWheel.setAttribute('transform', wheelPose);
      frontWheel.setAttribute('transform', wheelPose);
      crank.setAttribute('transform', `translate(${crankCenter.x} ${crankCenter.y}) rotate(${phase * radiansToDegrees})`);
      positionLeg(farLeg, phase + Math.PI);
      positionLeg(nearLeg, phase);

      pelican.setAttribute('transform', `translate(478 373) rotate(${1.2 * Math.sin(phase * 2)})`);
      scarf.setAttribute('transform', `translate(544 278) rotate(${6 * Math.sin(time * 7.5)}) scale(1 ${1 + .12 * Math.sin(time * 11)})`);
      const blink = time % 4.8 - 3.3;
      const eyeHeight = 1 - .88 * Math.max(0, 1 - Math.abs(blink) / .09);
      eye.setAttribute('transform', `scale(1 ${eyeHeight})`);

      clouds.setAttribute('transform', `translate(${-((time * 8) % 1240)} 0)`);
      water.setAttribute('transform', `translate(${-((time * 31) % 530)} 0)`);
      road.setAttribute('transform', `translate(${-(distance % 314)} 0)`);
      grasses.setAttribute('transform', `translate(${-((time * 354) % 530)} 0)`);
      gulls.setAttribute('transform', `translate(${34 * Math.sin(time / 7)} ${5 * Math.sin(time / 2.6)})`);

      const breeze = time % 2.8 / 2.8;
      windOne.setAttribute('transform', `translate(${-44 * breeze} 0)`);
      windTwo.setAttribute('transform', `translate(${-32 * breeze} 0)`);
      windOne.style.opacity = .78 * Math.sin(Math.PI * breeze);
      windTwo.style.opacity = .58 * Math.sin(Math.PI * breeze);
    }

    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    let playing;
    let elapsed = 0;
    let startTime;
    let frame;

    function tick(timestamp) {
      startTime ??= timestamp - elapsed * 1000;
      elapsed = (timestamp - startTime) / 1000;
      render(elapsed);
      frame = requestAnimationFrame(tick);
    }

    function setPlaying(next) {
      if (playing === next) return;
      playing = next;
      playbackLabel.textContent = playing ? '暂停' : '播放';
      playbackIcon.setAttribute('d', playing ? 'M3 2h3v12H3zm7 0h3v12h-3z' : 'm4 2 10 6-10 6Z');
      if (playing) {
        startTime = undefined;
        frame = requestAnimationFrame(tick);
      } else {
        cancelAnimationFrame(frame);
      }
    }

    render(0);
    setPlaying(!reducedMotion.matches);
    playback.hidden = false;
    playback.addEventListener('click', () => setPlaying(!playing));
    reducedMotion.addEventListener('change', (event) => setPlaying(!event.matches));
  </script>
</body>
</html>
