server {
    listen 80;
    listen [::]:80;
    server_name __PAPER_STORAGE_DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __PAPER_STORAGE_DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__PAPER_STORAGE_DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__PAPER_STORAGE_DOMAIN__/privkey.pem;
    client_max_body_size 21m;
    add_header Referrer-Policy "no-referrer" always;

    location = /healthz {
        proxy_pass http://127.0.0.1:8081;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location /v1/uploads/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /v1/files/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_connect_timeout 5s;
        proxy_read_timeout 300s;
        access_log off;
    }

    location /internal/v1/ {
        return 404;
    }

    location / {
        return 404;
    }
}
