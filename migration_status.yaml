      - "JSON 空值、格式、顶层结构和 2 MB 大小限制已本地校验；新预览失败时不会保留旧提交数据"
      - "分享码预览与提交已补齐输入校验和网络异常反馈"
      - "认证、教务、平台边界、私信通知、考试缓存和竞赛导入共 71 项定向测试通过"
      - "最新 x64 HAP 已使用 hdc install -r 保留数据覆盖安装，登录态和教务绑定保持不变"
