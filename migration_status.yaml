      - "ArkTS OhosLiveViewPlugin 使用 API 24 Live View Kit 实现创建、更新、结束和系统开关检查"
      - "下一节课已接入课表缓存、网络刷新、课程编辑和学期切换后的同步入口"
      - "超过 60 分钟不创建，60 分钟内创建，到达开始时间更新为上课中，到达结束时间自动结束"
