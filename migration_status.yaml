      - "竞赛 JSON 文本导入已在 x64 模拟器验收：非法 JSON 本地拒绝，合法空 events 返回 200 并生成 0 条预览；未执行合并或覆盖"
    issues:
      - type: "test_data"
        description: "当前服务端推荐、学校认定等竞赛筛选均为 0 条，详情和加入计划同步暂时无法用真实数据验收"
        priority: "medium"

