name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # 格式检查独立成 job：以前它和 go vet / go test 串在同一步骤里，
  # 一个对齐问题会让后面两项整段跳过（审计 R01 第 2 条）。
  # 范围推导、删除文件、带空格路径、新分支等边界都落在脚本里，便于本机复跑验证。
  server-format:
    name: Go format check (changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Check changed Go files are formatted
        env:
          # 必须显式注入：`GITHUB_EVENT_BEFORE` 并不是 Actions 提供的环境变量，
          # 旧步骤读它永远得到空值，多提交 push 会退化成只查最后一个提交。
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check-go-format.sh

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go vet ./...
      # 计数断言：零条匹配或整体跳过不得算通过（审计 R01 第 8 条）。
      - name: Run Go tests
        run: bash "$GITHUB_WORKSPACE/scripts/ci-go-test.sh" 1 ./...

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sylulive_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sylulive_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/sylulive_integration_test?sslmode=disable
      ALLOW_DESTRUCTIVE_INTEGRATION_TESTS: "1"
      # 强制集成用例必须真正执行：缺环境时测试直接失败，而不是 t.Skip 后静默变绿。
      REQUIRE_INTEGRATION_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run PostgreSQL idempotency integration tests
        working-directory: server
        run: >-
          bash "$GITHUB_WORKSPACE/scripts/ci-go-test.sh" 1 -tags=integration ./internal/middleware
          -run '^TestIdempotencyMiddlewarePostgres' -count=1
      # 只跑内容发布额度 / 回复治理 / 安全事件的 PostgreSQL 集成用例：
      # 不加 -run 会把整包（含无需数据库的单测）重跑一遍，既重复又难以定位失败。
      # 注意：TestCanteenRateConcurrentOptimisticLock 目前自身 fixture 不完整——
      # 未迁移 canteen_* / files / academic_identity_bindings 等表就开始断言，
      # 在 CI 上必然失败。那是既有缺陷，需要单独修复后再纳入覆盖，
      # 不要用放宽 -run 或关掉断言的方式掩盖它。
      - name: Run PostgreSQL handlers/services integration tests
        working-directory: server
        run: >-
          bash "$GITHUB_WORKSPACE/scripts/ci-go-test.sh" 1 -tags=integration -p 1 ./internal/handlers ./internal/services
          -run '^(TestPostPublishQuota|TestReplyRejectedWhenPostHidden|TestSecurityEvent|TestFeedbackTicket.*Postgres|TestAwardDaily.*Postgres)'
          -count=1

  migration-upgrade:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sylulive_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sylulive_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: postgres://postgres:postgres@127.0.0.1:5432/sylulive_migration_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Upgrade legacy and current-minus-one fixtures twice
        working-directory: server
        run: >-
          bash "$GITHUB_WORKSPACE/scripts/ci-go-test.sh" 1 -tags=integration ./internal/models
          -run TestIdempotencySchemaUpgradeFromLegacyFixtures -count=1

  edu-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-edu-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  rag-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-rag-service
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements-test.txt
      - run: python -m compileall -q .
      - run: python -m pytest -q

  client:
    # Golden 平台可复现性：ubuntu-latest 镜像随 runner 更新漂移
    # （freetype/fontconfig 变化会让 canonical golden 全线 0.x% 抖动）。
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-warnings --no-fatal-infos
      # 关键可靠性路径使用默认 fatal 规则；保留全仓库历史样式告警的渐进式收口。
      - name: Analyze reliability-critical surfaces
        run: >-
          flutter analyze
          lib/screens/market_screen.dart
          lib/screens/poll/poll_detail_screen.dart
          lib/screens/notifications_screen.dart
          lib/screens/admin_panel_screen.dart
          lib/screens/admin_candidates_screen.dart
          lib/services/app_resume_coordinator.dart
          lib/services/retry_interceptor.dart
          lib/services/root_page_state_service.dart
          lib/services/keep_alive_service.dart
          lib/widgets/bottom_nav.dart
          lib/screens/image_viewer_screen.dart
          lib/providers/poll_provider.dart
          lib/providers/major_provider.dart
          lib/providers/teacher_provider.dart
          lib/providers/social_provider.dart
          lib/screens/my_content_screen.dart
          lib/screens/major_detail_screen.dart
          lib/screens/social_list_screen.dart
      - run: flutter test --reporter compact
      - name: Create ephemeral Android signing key
        working-directory: client/android/app
        env:
          ANDROID_STORE_PASSWORD: codex-ci-store
          # PKCS12（keytool 现代默认格式）不支持独立 key 密码，必须与 store 密码一致。
          ANDROID_KEY_PASSWORD: codex-ci-store
        run: >-
          keytool -genkeypair -v
          -keystore xiaoyuan.jks
          -storetype PKCS12
          -storepass "$ANDROID_STORE_PASSWORD"
          -keypass "$ANDROID_KEY_PASSWORD"
          -alias xiaoyuan
          -keyalg RSA
          -keysize 2048
          -validity 1
          -dname "CN=CI,O=SYLUlive,C=CN"
      - name: Build release APK smoke
        env:
          ANDROID_STORE_PASSWORD: codex-ci-store
          ANDROID_KEY_PASSWORD: codex-ci-store
        run: >-
          flutter build apk --release
          --dart-define=APP_API_URL=https://example.invalid/api
          --dart-define=JPUSH_APP_KEY=000000000000000000000000

  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg15-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ai_rag_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ai_rag_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGVECTOR_TEST_DSN: postgres://postgres:postgres@127.0.0.1:5432/ai_rag_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - name: Run independent pgvector migration test
        working-directory: server
        # 包一层计数断言：DSN 缺失时该用例会 t.Skip，裸 `go test` 会把它当成通过。
        run: >-
          bash "$GITHUB_WORKSPACE/scripts/ci-go-test.sh" 1 ./internal/models
          -run TestPGVectorMigrationIntegration -count=1

  client-platform-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze OHOS platform integrity
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Verify no direct Android plugin usage
        run: |
          if grep -rnE 'package:(jpush_flutter|flutter_local_notifications|url_launcher|flutter_secure_storage)' lib/ | grep -v 'lib/platform/'; then
            echo "Found direct usage of Android plugins without platform abstraction."
            exit 1
          fi

  # 审计 R01 第 6 条：web 与浏览器扩展此前没有任何门禁 job——
  # 类型检查、构建、单测和浏览器用例都只在开发者本机跑过。
  # 本机已验证：pnpm -r check、vitest 41 条、vite build、Playwright 16 条全绿；
  # CI 上的首次执行结果以本 workflow 的实际日志为准。
  web-verification:
    name: Web / extension typecheck, unit and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck every workspace package
        run: pnpm -r check
      - name: Run workspace unit tests
        run: pnpm test
      - name: Build web bundle and extension
        run: pnpm -r build

  web-e2e:
    name: Web browser E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npx playwright install --with-deps chromium
      - name: Run browser specs against the dev server
        run: pnpm test:e2e
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results
            playwright-report
          retention-days: 7
          if-no-files-found: ignore



