# 官网 v5 深链路由片段。
# 将本文件内容放入 sylulive.online 的 HTTPS server {} 中；root 应指向
# /opt/sylulive-site-v5。不要把 /team/{id} 重定向到 /team/index.html，
# 落地页需要保留原始 pathname 才能解析组队编号。

# 与正文和版本一起由 Go 发布，不能把协议路径伪装成官网首页。
location ~ ^/(terms|privacy|extension/privacy)$ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_intercept_errors off;
}

# Android App Links 声明必须按固定路径返回，不能落入官网首页回退路由。
location = /.well-known/assetlinks.json {
    default_type application/json;
    try_files /.well-known/assetlinks.json =404;
}

# 未安装 App 时，组队分享链接落到同一个静态落地页，同时保留浏览器地址中的 teamId。
location ~ ^/team/[1-9][0-9]*/?$ {
    try_files /team/index.html =404;
}

# 超管后台上传 APK：服务端上限 200 MB，站点默认 21m 会以 413 拦截。与 nginx/docker.conf 保持一致，
# 放在通用 location /api/ 之前；仍由 Go 校验超级管理员身份。
location ^~ /api/super/app-releases {
    client_max_body_size 205m;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
