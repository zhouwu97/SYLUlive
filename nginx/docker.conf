server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Android App Links 声明必须按固定路径返回，不能落入 Flutter 路由。
    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files /assetlinks.json =404;
    }

    # 未安装 App 时，组队分享链接落到轻量静态页面。
    location ~ ^/team/[1-9][0-9]*/?$ {
        try_files /share/team/index.html =404;
    }

    # Flutter Web 静态资源由当前容器直接提供，避免依赖不存在的 client 上游服务。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 请求代理到后端。
    location ^~ /api/upload_multiple {
        client_max_body_size 95m;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/upload {
        client_max_body_size 12m;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/super/app-releases {
        client_max_body_size 205m;
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        # 试卷库允许最大 20 MiB 的 PDF；额外空间用于 multipart 边界，实际文件大小仍由后端严格校验。
        client_max_body_size 21m;

        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 公开上传资源始终先通过 Go 校验 files.access_scope；Go 拒绝时 Nginx 不得改为静态回退。
    location ^~ /uploads/ {
        proxy_pass http://server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;

        client_max_body_size 10m;
        proxy_read_timeout 60s;
    }

    # Go 通过权限检查后才会返回此路径。internal 防止客户端直接绕过 Go 读取共享卷。
    # 该 alias 只指向公开上传卷；试卷和竞赛证明材料私有卷不挂载到此容器。
    location ^~ /_internal/uploads/ {
        internal;
        alias /var/lib/sylulive/uploads/;
        disable_symlinks on from=/var/lib/sylulive/uploads/;
        autoindex off;
        sendfile on;
        aio threads;
    }

    # 公共表情高清资源由后端内嵌资源目录提供，响应包含长期缓存头。
    location /stickers/ {
        proxy_pass http://server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
