services:
  # PostgreSQL数据库
  postgres:
    image: pgvector/pgvector:0.8.2-pg15-bookworm
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - POSTGRES_DB=shenliyuan
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - shenliyuan_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Go后端服务

  python-edu-service:
    build:
      context: ./python-edu-service
      dockerfile: Dockerfile
    environment:
      - INTERNAL_SERVICE_TOKEN=${EDU_SERVICE_TOKEN:-}
      - EDU_CREDENTIAL_ENCRYPTION_KEY=${EDU_CREDENTIAL_ENCRYPTION_KEY:-}
      - JWC_CRAWLER_CONTACT=${JWC_CRAWLER_CONTACT:-}
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - shenliyuan_network

  # 独立 RAG 服务不接触教务凭证、Cookie 或用户数据库。
  python-rag-service:
    build:
      context: ./python-rag-service
      dockerfile: Dockerfile
    environment:
      - RAG_SERVICE_TOKEN=${RAG_SERVICE_TOKEN:-}
      - RAG_EMBEDDING_MODEL=${RAG_EMBEDDING_MODEL:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      - RAG_EMBEDDING_MODEL_VERSION=${RAG_EMBEDDING_MODEL_VERSION:-paraphrase-multilingual-minilm-l12-v2-padded-1536-v1}
      - RAG_MAX_CONCURRENCY=${RAG_MAX_CONCURRENCY:-2}
      - RAG_MAX_BATCH=${RAG_MAX_BATCH:-32}
      - RAG_QUERY_TIMEOUT_SECONDS=${RAG_QUERY_TIMEOUT_SECONDS:-60}
      - RAG_CHAT_PROVIDER=${RAG_CHAT_PROVIDER:-openai-compatible}
      - RAG_CHAT_MODEL=${RAG_CHAT_MODEL:-}
      - RAG_PROVIDER_API_KEY=${RAG_PROVIDER_API_KEY:-}
      - RAG_PROVIDER_BASE_URL=${RAG_PROVIDER_BASE_URL:-https://api.deepseek.com}
      - RAG_PROVIDER_ALLOWED_BASE_URLS=${RAG_PROVIDER_ALLOWED_BASE_URLS:-https://api.deepseek.com}
      - RAG_PROVIDER_TIMEOUT_SECONDS=${RAG_PROVIDER_TIMEOUT_SECONDS:-45}
      - LANGCHAIN_TRACING_V2=false
    expose:
      - "8001"
    restart: unless-stopped
    networks:
      - shenliyuan_network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env}
      - DSN=${DSN:-host=postgres port=5432 user=postgres password=${DB_PASSWORD:?set DB_PASSWORD in .env} dbname=shenliyuan sslmode=disable}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - EXAM_PAPER_DIR=${EXAM_PAPER_DIR:-/app/private/exam-papers}
      - COMPETITION_AWARD_EVIDENCE_DIR=${COMPETITION_AWARD_EVIDENCE_DIR:-/app/private/competition-award-evidence}
      - SUPER_ADMIN_ID=${SUPER_ADMIN_ID:?set SUPER_ADMIN_ID in .env}
      - SUPER_ADMIN_PASSWORD=${SUPER_ADMIN_PASSWORD:?set SUPER_ADMIN_PASSWORD in .env}
      - EDU_SERVICE_URL=${EDU_SERVICE_URL:-http://python-edu-service:8000}
      - EDU_SERVICE_TOKEN=${EDU_SERVICE_TOKEN:-}
      - JWC_SYNC_ENABLED=${JWC_SYNC_ENABLED:-false}
      - JWC_SYNC_INTERVAL_MINUTES=${JWC_SYNC_INTERVAL_MINUTES:-20}
      - AI_ENABLED=${AI_ENABLED:-false}
      - AI_INTERNAL_TEST_ONLY=${AI_INTERNAL_TEST_ONLY:-true}
      - AI_TEST_USER_IDS=${AI_TEST_USER_IDS:-}
      - AI_PROVIDER=${AI_PROVIDER:-deepseek}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_CHAT_MODEL=${DEEPSEEK_CHAT_MODEL:-deepseek-v4-flash}
      - AI_REQUEST_TIMEOUT_SECONDS=${AI_REQUEST_TIMEOUT_SECONDS:-60}
      - AI_MAX_TOOL_STEPS=${AI_MAX_TOOL_STEPS:-3}
      - AI_MAX_MESSAGE_CHARS=${AI_MAX_MESSAGE_CHARS:-20}
      - AI_HOURLY_MESSAGE_LIMIT=${AI_HOURLY_MESSAGE_LIMIT:-3}
      - AI_USER_BUDGET_LIMIT_MICRO_YUAN=${AI_USER_BUDGET_LIMIT_MICRO_YUAN:-10000000}
      - AI_RESERVE_MICRO_YUAN=${AI_RESERVE_MICRO_YUAN:-20000}
      - AI_INPUT_PRICE_MICRO_YUAN_PER_MILLION_TOKENS=${AI_INPUT_PRICE_MICRO_YUAN_PER_MILLION_TOKENS:-4000000}
      - AI_OUTPUT_PRICE_MICRO_YUAN_PER_MILLION_TOKENS=${AI_OUTPUT_PRICE_MICRO_YUAN_PER_MILLION_TOKENS:-16000000}
      - AI_POLICY_RAG_ENABLED=${AI_POLICY_RAG_ENABLED:-false}
      - AI_LANGCHAIN_RAG_ENABLED=${AI_LANGCHAIN_RAG_ENABLED:-false}
      - RAG_SERVICE_URL=${RAG_SERVICE_URL:-http://python-rag-service:8001}
      - RAG_SERVICE_TOKEN=${RAG_SERVICE_TOKEN:-}
      - RAG_EMBEDDING_MODEL_VERSION=${RAG_EMBEDDING_MODEL_VERSION:-paraphrase-multilingual-minilm-l12-v2-padded-1536-v1}
      - GIN_MODE=release
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - server_data:/app/uploads
      - exam_paper_data:/app/private/exam-papers
      - competition_award_evidence_data:/app/private/competition-award-evidence
    restart: unless-stopped
    networks:
      - shenliyuan_network


  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/docker.conf:/etc/nginx/conf.d/default.conf:ro
      - ./client/build/web:/usr/share/nginx/html:ro
    depends_on:
      - server
    networks:
      - shenliyuan_network

volumes:
  server_data:
  exam_paper_data:
  competition_award_evidence_data:
  postgres_data:

networks:
  shenliyuan_network:
    driver: bridge
