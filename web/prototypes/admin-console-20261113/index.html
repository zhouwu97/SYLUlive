<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>管理中心改版设计稿</title>
<!-- 主题与站点一致：深浅色只看站点自己的 sylulive-theme（不跟随系统），主题色与背景读 sylulive-appearance，
     与 web/index.html、appearance.tsx 的规则相同；在首帧前写好 data-*，避免先闪一下错误的主题。 -->
<script>
(function () {
  var root = document.documentElement;
  window.applySiteTheme = function () {
    try {
      var t = localStorage.getItem('sylulive-theme');
      root.dataset.theme = t === 'dark' ? 'dark' : 'light';
      var a = JSON.parse(localStorage.getItem('sylulive-appearance') || '{}');
      var accent = typeof a.accent === 'string' && /^#[0-9a-f]{6}$/i.test(a.accent) ? a.accent.toLowerCase() : '#3d63f0';
      if (accent === '#3d63f0') { delete root.dataset.accent; root.style.removeProperty('--user-accent'); }
      else { root.dataset.accent = 'custom'; root.style.setProperty('--user-accent', accent); }
      root.dataset.wash = ['section', 'accent', 'plain'].indexOf(a.wash) >= 0 ? a.wash : 'section';
    } catch (e) { root.dataset.theme = 'light'; }
  };
  applySiteTheme();
})();
</script>
<!-- 直接引用站点的设计令牌，颜色、字体和深色值都以它为准。 -->
<link rel="stylesheet" href="../../tokens.css">
<style>
/* 设计稿：管理中心工作台。所有颜色映射到 web/tokens.css 的 --color-*，括号里的值只在令牌没加载时兜底。 */
:root, :root[data-theme="dark"] {
  --bg: var(--color-paper, #f4f5f8); --surface: var(--color-surface, #fff); --surface-2: var(--color-paper-2, #f7f8fa); --surface-3: var(--color-paper-3, #eef0f4);
  --ink: var(--color-ink, #171a21); --ink-2: var(--color-ink-2, #3b414d); --muted: var(--color-muted, #646c7a); --faint: var(--color-muted, #646c7a);
  --rule: var(--color-rule, #e3e6ec); --rule-soft: var(--color-rule-soft, #eef0f4);
  --accent: var(--color-accent, #3358e0); --accent-fill: var(--color-accent-fill, #3d63f0); --accent-ink: var(--color-accent-ink, #fff);
  --accent-soft: var(--color-accent-soft, #edf1fe); --accent-border: var(--color-accent-border, #d3dcfb);
  --danger: var(--color-error, #b42d2d); --success: var(--color-success, #1d7a4e);
  --danger-soft: color-mix(in oklab, var(--danger) 12%, var(--surface)); --success-soft: color-mix(in oklab, var(--success) 12%, var(--surface));
  --warn: #9a5a0c; --warn-soft: color-mix(in oklab, #d98b1c 14%, var(--surface));
  --violet: var(--icon-violet, #7653b8); --violet-soft: color-mix(in oklab, #7653b8 12%, var(--surface));
  --shadow: var(--shadow-card, 0 1px 2px rgb(20 24 33 / .04));
  --r-card: 14px; --r-ctl: 10px; --r-sm: 7px;
  --font: var(--font-body, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif);
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
/* 站点深色令牌里没有琥珀和紫色，这两种状态色在深色下单独提亮。 */
:root[data-theme="dark"] { --warn: #f0bf6e; --violet: #c7b2ff; color-scheme: dark; }
/* 自定义主题色：与 desktop-refresh.css 的换算一致（仅桌面宽度生效，手机网页对照 App 用默认色）。 */
@media (min-width: 601px) {
  :root[data-accent="custom"] { --color-accent-fill: var(--user-accent); --color-accent: color-mix(in oklab, var(--user-accent) 84%, #000); --color-accent-hover: color-mix(in oklab, var(--user-accent) 88%, #000); --color-focus: var(--color-accent); }
  :root[data-accent="custom"][data-theme="dark"] { --color-accent: color-mix(in oklab, var(--user-accent) 55%, #fff); --color-accent-border: color-mix(in oklab, var(--user-accent) 45%, var(--color-surface)); }
}
@supports (color: oklch(from red l c h)) {
  @media (min-width: 601px) {
    :root[data-accent="custom"] { --color-accent-fill: oklch(from var(--user-accent) min(l, .55) c h); --color-accent: oklch(from var(--user-accent) min(l, .5) c h); --color-accent-hover: oklch(from var(--user-accent) min(l, .48) c h); }
    :root[data-accent="custom"][data-theme="dark"] { --color-accent: oklch(from var(--user-accent) max(l, .8) min(c, .14) h); }
  }
}
/* 页面顶部淡色渐变：管理中心不属于某个分区，按站点规则跟随主题色；“纯色”背景下不显示。 */
@media (min-width: 601px) {
  body { position: relative; isolation: isolate; }
  body::before { content: ""; position: absolute; inset: 0 0 auto; z-index: -1; height: 520px; pointer-events: none;
    background: radial-gradient(52% 100% at 18% 0%, color-mix(in oklab, var(--accent-fill) 15%, transparent), transparent 72%),
      radial-gradient(42% 90% at 86% 0%, color-mix(in oklab, var(--accent-fill) 10%, transparent), transparent 70%),
      linear-gradient(to bottom, color-mix(in oklab, var(--accent-fill) 5%, transparent), transparent); }
  :root[data-theme="dark"] body::before { opacity: .7; }
  :root[data-wash="plain"] body::before { opacity: 0; }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
.svg { width: 18px; height: 18px; flex: 0 0 auto; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- 顶栏：沿用全站导航，管理中心不再重复社区侧栏 ---------- */
.topbar { position: sticky; top: 0; z-index: 20; height: 60px; display: flex; align-items: center; gap: 24px; padding: 0 24px; background: color-mix(in oklab, var(--bg) 78%, transparent); -webkit-backdrop-filter: saturate(1.6) blur(16px); backdrop-filter: saturate(1.6) blur(16px); border-bottom: 1px solid color-mix(in oklab, var(--rule) 70%, transparent); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; white-space: nowrap; }
.brand-mark { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-fill); display: grid; place-items: center; color: var(--accent-ink); font-size: 14px; }
.brand small { font-weight: 600; font-size: 12px; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--accent-border); padding: 1px 8px; border-radius: 999px; }
.top-links { display: flex; gap: 4px; }
.top-links a { padding: 6px 12px; border-radius: var(--r-sm); color: var(--muted); text-decoration: none; font-size: 14px; }
.top-links a:hover { color: var(--ink); background: var(--surface-3); }
.top-spacer { flex: 1; }
.top-search { display: flex; align-items: center; gap: 8px; width: 280px; height: 38px; padding: 0 12px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface-2); color: var(--muted); }
.top-search kbd { margin-left: auto; font: 11px var(--mono); border: 1px solid var(--rule); border-radius: 5px; padding: 0 5px; }
.icon-btn { width: 38px; height: 38px; display: grid; place-items: center; border: 0; background: transparent; border-radius: var(--r-ctl); color: var(--ink-2); position: relative; }
.icon-btn:hover { background: var(--surface-3); }
.avatar { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #f5c6d6, #c9b6ff); color: #4a2a5a; font-weight: 700; font-size: 13px; }

/* ---------- 主体：左侧分组导航 + 内容区 ---------- */
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); max-width: 1440px; margin: 0 auto; min-height: calc(100vh - 60px); }
.side { position: sticky; top: 60px; height: calc(100vh - 60px); overflow-y: auto; padding: 20px 14px 24px 20px; border-right: 1px solid var(--rule); }
.side-back { display: flex; align-items: center; gap: 6px; color: var(--muted); text-decoration: none; font-size: 13px; padding: 4px 8px; border-radius: var(--r-sm); width: fit-content; }
.side-back:hover { color: var(--ink); background: var(--surface-3); }
.who { display: flex; align-items: center; gap: 10px; margin: 14px 4px 18px; padding: 12px; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); }
.who b { display: block; font-size: 14px; }
.who span { font-size: 12px; color: var(--muted); }
.nav-group { margin-top: 14px; }
.nav-group h4 { padding: 0 10px 6px; font-size: 12px; font-weight: 600; color: var(--faint); letter-spacing: .02em; display: flex; justify-content: space-between; }
.nav-item { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 38px; padding: 0 10px; border: 0; border-radius: var(--r-ctl); background: transparent; color: var(--ink-2); text-align: left; font-size: 14px; }
.nav-item:hover { background: var(--surface-3); color: var(--ink); }
.nav-item[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .count { margin-left: auto; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 12px; font-weight: 600; display: grid; place-items: center; background: var(--surface-3); color: var(--muted); font-variant-numeric: tabular-nums; }
.nav-item .count.hot { background: var(--danger); color: #fff; }
:root[data-theme="dark"] .nav-item .count.hot { color: #2a0d0d; }
.nav-item .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 50%; background: var(--warn); }
.nav-item[disabled] { opacity: .5; cursor: not-allowed; }
.nav-item .lock { margin-left: auto; color: var(--faint); }

.main { padding: 28px 36px 64px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.page-head h1 { font-size: 24px; font-weight: 700; line-height: 1.3; }
.page-head p { margin-top: 4px; color: var(--muted); font-size: 13px; }
.crumb { font-size: 12px; color: var(--faint); margin-bottom: 4px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 14px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface); color: var(--ink); font-size: 13px; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent-fill); border-color: var(--accent-fill); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--rule)); }
.btn.danger:hover { background: var(--danger-soft); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { color: var(--ink); background: var(--surface-3); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: 12px; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r-card); box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--rule-soft); }
.card-head h2 { font-size: 15px; font-weight: 650; }
.card-head span { font-size: 12px; color: var(--muted); }

.tag { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 600; white-space: nowrap; background: var(--surface-3); color: var(--ink-2); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.danger { background: var(--danger-soft); color: var(--danger); }
.tag.success { background: var(--success-soft); color: var(--success); }
.tag.violet { background: var(--violet-soft); color: var(--violet); }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .85; }
.tag.plain::before { display: none; }

.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface); flex-wrap: wrap; }
.seg button { min-height: 30px; padding: 0 12px; border: 0; border-radius: var(--r-sm); background: transparent; color: var(--muted); font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.seg em { font-style: normal; font-size: 11px; font-variant-numeric: tabular-nums; color: inherit; opacity: .75; }

/* ---------- 工作台 ---------- */
.hello { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.hello h1 { font-size: 26px; font-weight: 700; }
.hello p { color: var(--muted); margin-top: 4px; }
.hello strong { color: var(--ink); }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 20px; }
.kpi { text-align: left; padding: 16px 18px; border: 1px solid var(--rule); border-radius: var(--r-card); background: var(--surface); box-shadow: var(--shadow); display: grid; gap: 6px; transition: border-color .15s, transform .15s; }
.kpi:hover { border-color: var(--accent-border); transform: translateY(-1px); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; }
.kpi-icon { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; }
.kpi b { font-size: 28px; line-height: 1.15; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--muted); font-size: 12px; }
.kpi small.alert { color: var(--danger); font-weight: 600; }
.dash { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 20px; align-items: start; }
.queue-row { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto auto; align-items: center; gap: 14px; padding: 13px 20px; border-top: 1px solid var(--rule-soft); }
.queue-row:first-of-type { border-top: 0; }
.queue-row b { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.queue-row p { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wait { font-size: 12px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.wait.late { color: var(--danger); font-weight: 600; }
.health { padding: 6px 20px 14px; }
.health-row { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--rule-soft); }
.health-row:first-child { border-top: 0; }
.health-row .svg { margin-top: 2px; }
.health-row b { display: block; font-size: 13px; font-weight: 600; }
.health-row p { font-size: 12px; color: var(--muted); }
.ok { color: var(--success); } .bad { color: var(--danger); } .meh { color: var(--warn); }
.log-row { display: flex; justify-content: space-between; gap: 12px; padding: 10px 20px; border-top: 1px solid var(--rule-soft); font-size: 13px; }
.log-row:first-child { border-top: 0; }
.log-row time { color: var(--faint); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 20px; }

/* ---------- 工单：列表与详情同屏 ---------- */
.split { display: grid; grid-template-columns: minmax(320px, 400px) minmax(0, 1fr); gap: 16px; align-items: start; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
.search { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px; min-width: 220px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface); color: var(--muted); }
.search input { border: 0; outline: 0; background: transparent; width: 100%; color: var(--ink); }
.tlist { overflow: hidden; }
.trow { width: 100%; display: grid; gap: 4px; padding: 14px 16px; border: 0; border-top: 1px solid var(--rule-soft); background: transparent; text-align: left; position: relative; }
.trow:first-child { border-top: 0; }
.trow:hover { background: var(--surface-2); }
.trow[aria-current="true"] { background: var(--accent-soft); }
.trow[aria-current="true"]::before { content: ""; position: absolute; left: 0; top: 10px; bottom: 10px; width: 3px; border-radius: 0 3px 3px 0; background: var(--accent-fill); }
.trow-top { display: flex; align-items: center; gap: 8px; }
.trow-top b { flex: 1; min-width: 0; font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow p { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.trow-meta code { font-family: var(--mono); }
.detail { position: sticky; top: 80px; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: calc(100vh - 100px); overflow: hidden; }
.detail-head { padding: 18px 22px 16px; border-bottom: 1px solid var(--rule-soft); display: grid; gap: 10px; }
.detail-head h2 { font-size: 18px; font-weight: 700; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12px; color: var(--muted); }
.facts span b { color: var(--ink-2); font-weight: 600; }
.detail-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.detail-actions select { height: 32px; padding: 0 10px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); }
.thread { overflow-y: auto; padding: 18px 22px; display: grid; gap: 16px; align-content: start; }
.msg { display: grid; gap: 6px; max-width: 86%; }
.msg.me { justify-self: end; }
.msg-meta { font-size: 12px; color: var(--faint); display: flex; gap: 8px; }
.msg.me .msg-meta { justify-content: flex-end; }
.bubble { padding: 10px 14px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--rule-soft); white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.me .bubble { background: var(--accent-soft); border-color: var(--accent-border); }
.msg.note .bubble { background: var(--warn-soft); border: 1px dashed color-mix(in srgb, var(--warn) 40%, transparent); }
.sys { justify-self: center; font-size: 12px; color: var(--faint); background: var(--surface-2); padding: 2px 10px; border-radius: 999px; }
.extra { display: grid; gap: 6px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); font-size: 13px; }
.extra dt { font-size: 12px; color: var(--muted); font-weight: 600; }
.extra dd { margin: 0 0 6px; }
.composer { border-top: 1px solid var(--rule-soft); padding: 12px 16px 14px; display: grid; gap: 10px; background: var(--surface); }
.composer textarea { width: 100%; min-height: 72px; resize: vertical; padding: 10px 12px; border: 1px solid var(--rule); border-radius: var(--r-ctl); background: var(--surface); }
.composer-foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.hint { font-size: 12px; color: var(--muted); }
.back-mobile { display: none; }

/* ---------- 举报 ---------- */
.reports { display: grid; gap: 12px; }
.report { padding: 18px 20px; display: grid; gap: 12px; }
.report-top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.report-top b { font-size: 15px; }
.report-top .id { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.report-top .right { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.snapshot { display: grid; gap: 4px; padding: 12px 14px; border-radius: 10px; background: var(--surface-2); border-left: 3px solid var(--rule); }
.snapshot small { color: var(--faint); font-size: 12px; }
.snapshot p { overflow-wrap: anywhere; }
.report-foot { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.report-foot .meta { font-size: 12px; color: var(--muted); }
.decide { display: grid; gap: 12px; padding: 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--danger) 30%, var(--rule)); background: color-mix(in srgb, var(--danger-soft) 45%, var(--surface)); }
.decide label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; }
.decide textarea, .decide select { width: 100%; padding: 8px 10px; border: 1px solid var(--rule); border-radius: var(--r-sm); background: var(--surface); font-weight: 400; }
.decide textarea { min-height: 64px; resize: vertical; }
.decide small { font-weight: 400; color: var(--muted); font-size: 12px; }
.decide-foot { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- 通用列表 / 表格 / 指标 ---------- */
.rows .row { display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-top: 1px solid var(--rule-soft); }
.rows .row:first-child { border-top: 0; }
.row-main { flex: 1; min-width: 0; display: grid; gap: 3px; }
.row-main b { font-weight: 600; }
.row-main p { color: var(--muted); font-size: 13px; }
.row-side { display: flex; align-items: center; gap: 10px; }
.num { font-variant-numeric: tabular-nums; text-align: right; }
table { width: 100%; border-collapse: collapse; }
th, td { padding: 12px 20px; text-align: left; border-top: 1px solid var(--rule-soft); font-size: 13px; }
th { color: var(--muted); font-weight: 600; font-size: 12px; background: var(--surface-2); border-top: 0; }
.chart { padding: 18px 20px 14px; }

function paletteItems(q) {

    .map(([id, name, icon]) => ({group:'管理模块', icon, label:name, sub:'', go:id}));

  const rp = reports.filter(r => r.status === 'pending').map(r => ({group:'待处理举报', icon:'flag', label:`${REASON[r.code]} · ${r.target} #${r.tid}`, sub:r.snap, go:'reports'}));
  if (!q) return [...rp, ...tk.filter(x => x.sub.endsWith('待受理')), ...mods.slice(0, 6)];
  return [...mods, ...tk, ...rp].filter(x => (x.label + x.sub).toLowerCase().includes(q)).slice(0, 12);
}

document.addEventListener('click', e => {

  else if (d.mode) { state.replyMode = d.mode; render(); document.getElementById('replyBox')?.focus(); }
  else if (d.tpl !== undefined) { const box = document.getElementById('replyBox'); box.value = TEMPLATES[Number(d.tpl)][1]; box.focus(); }
  else if (d.accept) { tickets.find(t => t.no === d.accept).status = 'accepted'; render(); toast('已受理，用户会收到通知'); }
  else if (d.rfilter) { state.rfilter = d.rfilter; state.open = null; state.confirm = null; render(); }
  else if (d.open) { state.open = Number(d.open); state.confirm = null; render(); document.querySelector(`[data-decide="${d.open}"] textarea`)?.focus(); }
  else if (d.preset) { const ta = el.closest('form').reason; ta.value = d.preset; ta.focus(); }
  else if (d.cancel !== undefined) { state.open = null; render(); }
  else if (d.askignore) { state.confirm = Number(d.askignore); state.open = null; render(); }
  else if (d.unconfirm !== undefined) { state.confirm = null; render(); }
  else if (d.ignore) { const r = reports.find(x => x.id === Number(d.ignore)); r.status = 'ignored'; r.result = '举报不成立'; state.confirm = null; render(); toast(`已忽略举报 #${r.id}`); }
  else if (d.approve) { canteenQueue = canteenQueue.filter(c => c.name !== d.approve); render(); toast('已通过，食堂已公开'); }
  else if (d.toast) toast(d.toast);
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'dform') { closeLayer(); toast(f.dataset.kind === 'notice' ? '公告已保存' : '版块已更新，修改原因已记入日志'); return; }
  if (f.dataset.decide) { const r = reports.find(x => x.id === Number(f.dataset.decide)); r.status = 'handled'; r.result = `确认违规 · ${f.reason.value.trim()}`; state.open = null; render(); toast(`举报 #${r.id} 已确认违规并完成治理`); }
  if (f.dataset.reply) {
    const text = f.text.value.trim(); if (!text) { toast('请先输入内容'); f.text.focus(); return; }
    const t = tickets.find(x => x.no === f.dataset.reply), note = state.replyMode === 'note', wait = e.submitter?.name === 'wait';
    t.thread.push({me:true, note, who: note ? '内部备注' : '管理员 纯合子', t: NOW, text});
    if (wait) t.status = 'waiting_user'; else if (!note && t.status === 'pending') t.status = 'accepted';
    render(); toast(note ? '备注已保存' : wait ? '已回复，状态改为待补充' : '回复已发送');
  }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); state.palette ? closeLayer() : openPalette(); return; }
  if (e.key === 'Escape' && (state.palette || state.drawer)) { e.preventDefault(); closeLayer(); return; }
  if (state.palette && ['ArrowDown','ArrowUp','Enter'].includes(e.key)) {
    e.preventDefault(); const p = state.palette, n = p.items.length; if (!n) return;
    if (e.key === 'Enter') { const x = p.items[p.i]; closeLayer(); go(x.go); return; }
    p.i = (p.i + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; renderPaletteList(); return;
  }
  if (e.key === 'Enter' && e.ctrlKey && e.target.matches('.composer textarea')) { e.target.form.requestSubmit(); return; }
  // 工单页单键快捷键：输入框内、按住修饰键或弹层打开时不触发。
  const typing = e.target.matches('input, textarea, select') || e.ctrlKey || e.metaKey || e.altKey || state.drawer || state.palette;
  if (!typing && state.view === 'tickets' && ['j','k','r'].includes(e.key.toLowerCase())) {
    e.preventDefault();
    if (e.key.toLowerCase() === 'r') { document.getElementById('replyBox')?.focus(); return; }
    const list = ticketList(), i = list.findIndex(t => t.no === state.ticket);
    const next = list[Math.min(list.length - 1, Math.max(0, i + (e.key.toLowerCase() === 'j' ? 1 : -1)))];
    if (next) { state.ticket = next.no; render(); document.querySelector('.trow[aria-current="true"]')?.focus(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'tq') { state.q = e.target.value; const pos = e.target.selectionStart; render(); const i = document.getElementById('tq'); i.focus(); i.setSelectionRange(pos, pos); }
  if (e.target.id === 'pinput') { state.palette.q = e.target.value; state.palette.i = 0; renderPaletteList(); }
  if (e.target.closest('#dform')) renderPreview();
});
document.addEventListener('change', e => {
  if (e.target.dataset.status) { tickets.find(t => t.no === e.target.dataset.status).status = e.target.value; render(); toast('状态已更新'); }
  if (e.target.closest('#dform')) renderPreview();
  if (e.target.id === 'demoRole') { state.role = e.target.value; if (state.role !== 'super' && ['users','bots','releases','logs','awards'].includes(state.view)) state.view = 'home'; render(); }
  if (e.target.id === 'demoApi') { state.api = e.target.value; render(); }
  if (e.target.id === 'demoData') {
    state.data = e.target.value;
    const empty = state.data === 'empty';
    tickets = empty ? [] : ALL_TICKETS; reports = empty ? [] : ALL_REPORTS; canteenQueue = empty ? [] : ALL_CANTEENS;
    render();
  }
});
// 设计稿控件可收起；手机宽度默认收起，避免挡住页面底部。
const demo = document.querySelector('.demo'), demoToggle = document.getElementById('demoToggle');
const setDemo = min => { demo.classList.toggle('min', min); demoToggle.setAttribute('aria-expanded', String(!min)); demoToggle.textContent = min ? '设计稿 ▸' : '设计稿 ◂'; };
setDemo(matchMedia('(max-width: 600px)').matches);
demoToggle.addEventListener('click', () => setDemo(!demo.classList.contains('min')));
// 深浅色按钮只临时预览，不写入站点设置；站点里切换主题或主题色时，这里实时跟随。
document.getElementById('demoTheme').addEventListener('click', () => {
  const root = document.documentElement;
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
});
addEventListener('storage', e => { if (e.key === 'sylulive-theme' || e.key === 'sylulive-appearance') applySiteTheme(); });
render();
</script>
